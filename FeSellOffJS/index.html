<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Hóa Đơn</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div style="display: flex;">
        <div class="left-body">
            <div style="margin: 5px;">
                <!-- Tabs chuyển hóa đơn -->
                <div id="invoice-tabs" class="invoice-tabs"></div>

                <!-- Nút thêm hóa đơn -->
                <button id="add-invoice">+ Tạo hóa đơn</button>

                <!-- Nội dung hóa đơn -->
                <div id="invoice-content" class="invoice-content"></div>
            </div>

            <!-- Popup chọn sản phẩm -->
            <div id="product-popup" class="popup">
                <div class="popup-content">
                    <h2>Chọn sản phẩm</h2>
                    <input type="text" id="search-product" placeholder="Tìm theo mã sản phẩm...">
                    <table id="product-table" class="product-table">
                        <thead>
                            <tr>
                                <th>Image</th>
                                <th>Name</th>
                                <th>Quantity</th>
                                <th>Add</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                    <button type="button" class="btnClose" onclick="closePopup()">X</button>
                </div>
            </div>
            <!-- Popup thông báo -->
            <div id="notification-popup" class="popup">
                <div class="popup-content">
                    <h3 align="center" id="notification-message"></h3>
                    <img align="center"
                        src="https://lh3.googleusercontent.com/l1PbMRIFRS4BcOXSyUjbSsi3OKJOdp6ysy0G5w2O-jNCHcRMnWRDXSWNee0MHifq9IMVqLxo23K3A0iMh8UutYMjOUpwyrsxnS-VpO7S=rp-w1080-nu"
                        style="width: auto; height: 400px;" alt="">
                    <button class="btnClose" style="margin-left: 85%;" onclick="closeNotification()">Đóng</button>
                </div>
            </div>
        </div>
        <div class="right-body">
